# autopilot.conf — Project-level orchestrator configuration

# Operator name — used in skill prompts and notifications.
# Defaults to git user.name or $USER if not set here.
# OPERATOR_NAME=

# GitHub username — used as PR reviewer.
# Defaults to `gh api user -q .login` if not set here.
# GITHUB_REVIEWER=

# Agent provider for task execution. Each task can override this
# with an `agent:` field in its YAML frontmatter.
DEFAULT_AGENT=claude

# Agent provider for the architect session (the interactive planning window)
ARCHITECT_AGENT=claude
